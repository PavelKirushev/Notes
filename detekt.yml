config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false
  excludes: ''

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 10
  LongMethod:
    active: true
    threshold: 260
  LargeClass:
    active: true
    threshold: 1200
  NamedArguments:
    threshold: 2
  LongParameterList:
    active: true
    functionThreshold: 60
    constructorThreshold: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotated: ["Inject", "AssistedInject"]
  TooManyFunctions:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
    thresholdInFiles: 100
    thresholdInClasses: 100
    thresholdInInterfaces: 100
    thresholdInObjects: 100
    thresholdInEnums: 100
    ignoreDeprecated: false
    ignorePrivate: false
  NestedBlockDepth:
    active: true
    threshold: 5

naming:
  active: true
  FunctionNaming:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'

style:
  active: true
  MagicNumber:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/*.kts', '**/Color.kt', '**/Theme.kt', '**/Type.kt', '**/VoskTranscriptionScreen.kt']
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true
  ClassOrdering:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated: ['Preview', 'KvadraTPreviews']
  ReturnCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

exceptions:
  SwallowedException:
    ignoredExceptionTypes: ['InterruptedException', 'MalformedURLException',
                            'NumberFormatException', 'ParseException', 'XmlPullParserException']
    ignoreAnnotated: ['Test']
  TooGenericExceptionCaught:
    exceptionNames: ['IllegalMonitorStateException', 'Throwable']

potential-bugs:
  IgnoredReturnValue:
    active: true
    ignoreAnnotated: ['Test']
